<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        AI Resume Coach
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            AI Resume Coach
        </div>

        <a href="{{ url_for('resume.home') }}">
            Home
        </a>

    </nav>


    <main>

        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="flash">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        {% block content %}

        {% endblock %}

    </main>


    <script src="{{ url_for('static', filename='js/main.js') }}">
    </script>

</body>

</html>
